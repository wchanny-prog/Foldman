name: Build APK

on:
  push:
    branches: [main, tape-cases]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # One signing key for every build, so each new APK installs over the last one without
      # uninstalling. It lives only in this repository's Actions cache, never in the source.
      - name: Restore signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: ci-signing.jks
          key: ci-signing-key-v1

      - name: Create signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore ci-signing.jks -storepass foldman-ci -keypass foldman-ci \
            -alias foldman -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Foldman personal build"

      - name: Configure signing
        run: |
          {
            echo "storeFile=$GITHUB_WORKSPACE/ci-signing.jks"
            echo "storePassword=foldman-ci"
            echo "keyAlias=foldman"
            echo "keyPassword=foldman-ci"
          } > signing.properties

      - name: Build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Find APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" Foldman-tape-cases.apk
          echo "Built $apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Foldman-apk
          path: Foldman-tape-cases.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" Foldman-tape-cases.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Personal build of Foldman with the tape-case shelf. Without Apple's MusicKit SDK: Apple Music plays through the Apple Music app."
